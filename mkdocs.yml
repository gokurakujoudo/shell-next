site_name: shell-next
site_description: Persistent asynchronous shell sessions, with deterministic application tests.
site_url: https://gokurakujoudo.github.io/shell-next/
repo_url: https://github.com/gokurakujoudo/shell-next
repo_name: GitHub
edit_uri: edit/main/docs/
strict: true
theme:
  name: readthedocs
  highlightjs: true
  navigation_depth: 3
  prev_next_buttons_location: bottom
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Ordinary and multiple commands: tutorials/01-commands.md
      - Directory navigation: tutorials/02-navigation.md
      - Environment variables: tutorials/03-environment.md
      - Native scripts and script files: tutorials/04-scripts.md
      - Output decoding and full capture: tutorials/05-capture.md
      - Interactive input and live events: tutorials/06-input-and-events.md
      - Failures and lifecycle: tutorials/07-errors-and-lifecycle.md
      - Queued and concurrent work: tutorials/08-concurrency.md
      - Sudo and capabilities: tutorials/09-sudo.md
      - Deterministic application tests: tutorials/10-mocking.md
      - Complete workflow: tutorials/11-workflow.md
  - Usage guide: usage.md
  - Backend support: backends.md
  - Testing applications: testing.md
  - Troubleshooting: troubleshooting.md
  - Development:
      - Architecture: development/architecture.md
      - Specification: development/specification.md
      - Release gates: development/release.md
      - Documentation: development/documentation.md
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
extra_css:
  - assets/stylesheets/brand.css
copyright: shell-next contributors · MIT license
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
