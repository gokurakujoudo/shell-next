name: quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python scripts/quality/check_source.py
      - name: Run platform contracts and collect partial coverage
        run: python -m pytest --cov --cov-branch --cov-report=xml --cov-fail-under=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: .coverage
          include-hidden-files: true
  release-gates:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: reports/coverage
      - run: python -m coverage combine reports/coverage/coverage-ubuntu-latest reports/coverage/coverage-windows-latest
      - name: Enforce full combined branch coverage
        run: python -m coverage report --fail-under=100
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
